# Docker Sandboxes kit: Package Guard in every sandbox.
#
#   sbx run claude --kit <path-to-this-directory> .
#   sbx create --name <n> claude --kit <path-to-this-directory> .
#
# The same on every host. On Windows, sbx runs a Linux microVM on the Windows
# Hypervisor Platform -- no WSL2 -- and mounts the project folder into it, so
# the guard runs on Linux exactly as it does on macOS and Linux hosts.
#
# Two steps, because the workspace may not be mounted yet when setup.install
# runs (Docker's v2 kit spec), and sbx substitutes nothing in a command: every
# $VAR below is expanded by the shell.
#
#   setup.install  (once, at creation) copies the guard into the agent user's
#                  ~/.cache/package-guard -- from the bundle a built kit
#                  carries (sbx_kit.py), else by cloning PG_REPO -- and runs
#                  its install.sh against a
#                  scratch directory, which puts uv (and a CPython 3.11 if the
#                  image has none) in ~/.local/bin, where the hooks look.
#   setup.startup  (every start, no network) installs the guard into
#                  $WORKSPACE_DIR when the project does not already carry it.
#
# Both run as the agent user (1000), so nothing in the workspace or home ends
# up owned by root. The sandbox's outbound proxy is closed by default; the
# allow list below is exactly what the installer and the guard need.
#
# The built kit (python3 sbx_kit.py) bundles the guard, so it needs no clone.
# This directory on its own clones PG_REPO, which is public, so the clone
# needs no git credential. Only a private fork in PG_REPO needs one (a token
# in the URL, or a credential helper the image carries); without it the clone
# fails and the installer prints git's error.

schemaVersion: "2"
kind: mixin
name: package-guard

setup:
  install:
    - description: Fetch Package Guard and set up its runner (uv)
      user: "1000"
      command: >-
        set -eu;
        HOME="${HOME:-/home/agent}"; export HOME;
        src="$HOME/.cache/package-guard"; rm -rf "$src"; mkdir -p "$HOME/.cache";
        if [ -f "$HOME/.package-guard-bundle/install.py" ]; then
        cp -R "$HOME/.package-guard-bundle" "$src"; from="the bundled copy";
        else
        command -v git >/dev/null || { echo "package-guard kit: git is not in this image" >&2; exit 1; };
        git -c advice.detachedHead=false clone --quiet --depth 1
        --branch "$PG_REF" "$PG_REPO" "$src"; from="$PG_REPO @ $PG_REF";
        fi;
        scratch=$(mktemp -d); sh "$src/install.sh" "$scratch" >/dev/null; rm -rf "$scratch";
        echo "package-guard kit: installed from $from and set up the runner"
  startup:
    - command:
        - sh
        - -c
        - >-
          ws="${WORKSPACE_DIR:-}";
          [ -n "$ws" ] || { echo "package-guard kit: WORKSPACE_DIR is not set; guard not installed" >&2; exit 1; };
          [ -f "$ws/.claude/hooks/package_guard/run.sh" ] ||
          sh "${HOME:-/home/agent}/.cache/package-guard/install.sh" "$ws"

environment:
  variables:
    PG_REPO: "https://github.com/Fefar-AT/package-guard.git"
    PG_REF: "release"

permissions:
  network:
    allow:
      # the guard's evidence sources: registries and OSV, plus the
      # reputation tier's npm downloads, the PyPI top-packages list and the
      # repository manifest on raw GitHub. Without these every
      # package is unresolved and goes to the vetter.
      - registry.npmjs.org
      - api.npmjs.org
      - pypi.org
      - api.osv.dev
      # the PyPI top-packages list moved to hugovk.dev; the old host
      # answers with a redirect there, so both are listed
      - hugovk.dev
      - hugovk.github.io
      - raw.githubusercontent.com
      # PyPI wheels and source archives, which pip and uv download
      - files.pythonhosted.org
      # the package-vetter's research: repository facts, PyPI downloads,
      # dependency and license data, and release diffs for npm and PyPI.
      # github.com does not cover api.github.com.
      - api.github.com
      - pypistats.org
      - api.deps.dev
      - data.jsdelivr.com
      - inspector.pypi.io
      # the installer: uv (and a managed CPython 3.11 if the image has none).
      # astral.sh/uv/<v>/install.sh redirects to releases.astral.sh, which
      # falls back to GitHub releases; those redirect to
      # release-assets.githubusercontent.com (objects.* is the older host).
      # github.com also covers the Package Guard clone.
      - astral.sh
      - releases.astral.sh
      - github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com

agentInstructions:
  content: |
    This project runs Package Guard. Before any npm / pip / uv command that
    acquires a package, invoke the `package-guard` skill and follow it. A
    denial that starts with PACKAGE_GUARD_ is expected; never work around it.
